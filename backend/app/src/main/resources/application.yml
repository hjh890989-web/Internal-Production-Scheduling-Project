# =============================================================================
# application.yml — 메인 entrypoint 설정
# =============================================================================
# 본 Task (TK-00-2-1) 단계 — Datasource·Redis·Flyway 설정은 모두 환경 변수로 외부화.
# 환경 변수 미설정 시 부팅 가능하도록 datasource/Redis는 'optional' 처리 (Sprint 1+ Task로 활성).
# =============================================================================

spring:
  application:
    name: scheduling

  # TK-01-1-1 multipart 한도 (3 워크북 × 20MB)
  servlet:
    multipart:
      max-file-size: 20MB               # 단일 파일
      max-request-size: 60MB            # 3 파일 동시

  # KST 통일 (BR-X04) — JSON serialize / deserialize 시 Asia/Seoul 강제
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    default-property-inclusion: non_null

  # JPA/SQL auto-config — Sprint 1 PG Task 전에는 비활성 (with-infra profile 로 활성).
  # Redis = TK-01-1-3 ImportTrackingService 가 StringRedisTemplate 필요 — bean 생성은 항상 OK
  # (실제 연결은 lazy — Redis 미가용 시 첫 호출에서 실패).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.modulith.events.jpa.JpaEventPublicationAutoConfiguration   # Sprint 6 EP-41 — with-infra profile 에서만 활성

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: Asia/Seoul     # BR-X04

server:
  port: 8080
  forward-headers-strategy: framework   # NGINX X-Forwarded-Proto 인식

# TK-01-1-1 Excel parser 설정 (Apache POI streaming)
scheduling:
  excel:
    max-file-size-mb: 20                # REQ-FUNC-OC-001
    row-cache-size: 100                 # SXSSF buffer (≤256MB 보장)
    buffer-size-bytes: 4096
    timeout-seconds: 60                 # REQ-NF-PER-001

  # Sprint 23 EP-MES-ADAPTER-1 — MES 실적 수신 adapter (BR-X06)
  # adapter=jpa (default) — DB stub (DEV/STG). adapter=http — 실 MES REST polling (PROD).
  # 실 vendor spec 미확보 — mock contract 기준. Phase 5+ 실 spec DTO 교체.
  mes:
    adapter: ${MES_ADAPTER:jpa}
    http:
      base-url: ${MES_URL:}
      bearer-token: ${MES_TOKEN:}
      timeout-seconds: 10

  # TK-03-2-3 Critical 분류 임계치 (BR-O02 / REQ-FUNC-OC-008)
  severity:
    qty-change-threshold-pct: 0.20      # BR-O02 ±20%
    delivery-date-always-critical: true
    hose-id-always-critical: true
    new-always-critical: true
    deleted-always-critical: true

  # TK-01-3-1/2/3 folder watcher (Could 우선순위, 기본 OFF)
  watcher:
    enabled: ${WATCHER_ENABLED:false}
    watch-folder: ${WATCHER_FOLDER:/data/inbox}
    poll-interval: PT60S                          # REQ-FUNC-OC-015
    file-pattern: "*.xlsx"
    duplicate-window-hours: 24
    stability:
      max-samples: 3
      sample-interval: PT1S

  # TK-03-3-1 알림 발송 (REQ-FUNC-OC-009)
  notification:
    app-url: ${APP_URL:https://schedule.intranet}
    default-target-role: PLANNER
    # Sprint 20 ST-COST-2 — Kakao Phase 5+ carry-over (Cost-Zero 정책).
    # 사용자 10명 이내 운영 / Slack 모바일 push 로 충분 / 월 ~1만원 비용 회피.
    # KakaoTalkClient + kakao_delivery_log 코드는 stub 유지 → 1년 뒤 부활 시
    # KAKAO_ENABLED=true + KAKAO_WEBHOOK_URL + KAKAO_BOT_TOKEN NSSM env 추가만으로
    # 즉시 활성 (~0.5 PD). 자세한 정책: docs/cost-policy/COST-ZERO_POLICY_v1.0.md
    kakao:
      enabled: ${KAKAO_ENABLED:false}                 # 영구 false (Phase 5+ carry-over)
      webhook-url: ${KAKAO_WEBHOOK_URL:}
      bot-token: ${KAKAO_BOT_TOKEN:}
      timeout-seconds: 5
    in-app:
      topic-prefix: /topic/notifications

management:
  endpoints:
    web:
      # Vite proxy /actuator 매칭 issue 회피 — actuator base-path 를 /api/actuator 로 변경.
      # 기존 /api proxy 활용 (모든 frontend 페이지에서 검증된 작동). PROD nginx 도 /api 통합.
      base-path: /api/actuator
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: scheduling
      environment: ${SPRING_PROFILES_ACTIVE:dev}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.scheduling: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# =============================================================================
# Profile: 'with-infra' — Sprint 1 PG/Redis 연동 후 활성
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: with-infra

  autoconfigure:
    exclude: []     # auto-config 복원

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:scheduling}
    username: ${POSTGRES_USER:app_user}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'"

  jpa:
    hibernate:
      ddl-auto: validate     # Flyway가 스키마 관리

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true        # Sprint 6 EP-41 — spring-modulith-events-jpa event_publication 테이블 자동 생성

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    schemas: app,master,audit,public,business_kpi     # public: V031 event_publication, business_kpi: V032 KPI
    locations: classpath:db/migration

  # Sprint 6 EP-42 — Keycloak OIDC (사내 IdP). 미설정 시 SecurityConfig fallback (permitAll).
  # SpEL #{null} — env var 미설정 시 property 자체 미등록 (빈 문자열 → JwtDecoder 빈 문자열 에러 회피)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:#{null}}   # 예: https://keycloak.intranet/realms/scheduling
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:#{null}}     # 예: https://keycloak.intranet/realms/scheduling/protocol/openid-connect/certs

# Resilience4j — Sprint 6 EP-41 (Kakao + Import client 안정성 NFR)
resilience4j:
  retry:
    instances:
      kakaotalk:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
      # Sprint 18 EP-NOTIFY — Slack webhook retry (TK-NOTIFY-3-1)
      slack:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
          - org.springframework.web.client.HttpServerErrorException
      # Sprint 23 EP-MES-ADAPTER-1 — MES HTTP polling retry (TK-MES-1-4)
      mes:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      kakaotalk:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      # Sprint 18 EP-NOTIFY — Slack webhook circuit breaker (TK-NOTIFY-3-1)
      slack:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      # Sprint 23 EP-MES-ADAPTER-1 — MES HTTP polling circuit breaker (TK-MES-1-4)
      mes:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
