# =============================================================================
# Promtail — TK-44-3-1 (EP-44, NFR-OBS-002)
# =============================================================================
# Spring Boot 로그 + MDC (traceId·userId·brId) → Loki push.
# REQ-NF-OPS-004 — 모든 mutation 로그 90일 검색 가능.
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Spring Boot app 로그 (logback JSON layout)
  - job_name: scheduling-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: scheduling-app
          service: scheduling-backend
          env: stg
          __path__: /var/log/scheduling/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: '@timestamp'
            level: level
            logger: logger_name
            traceId: traceId
            userId: userId
            brId: brId
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          logger:
          traceId:
          userId:
          brId:

  # Docker 컨테이너 로그 (운영 stg)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex:         '/(.*)'
        target_label:  container
