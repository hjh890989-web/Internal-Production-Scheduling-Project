# =============================================================================
# Loki config — TK-44-3-1 (EP-44, NFR-OBS-002)
# =============================================================================
# 로그 보존 90일 (REQ-NF-OPS-005). 사내 NAS storage_config 통합.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 90일 보존 — NFR-OPS-005
limits_config:
  retention_period: 2160h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager:9093    # Sprint 7+

frontend:
  encoding: protobuf
