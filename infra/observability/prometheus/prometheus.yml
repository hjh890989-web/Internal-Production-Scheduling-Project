# =============================================================================
# Prometheus scrape config — TK-44-1-1 (EP-44, NFR-OBS-001)
# =============================================================================
# Spring Boot Actuator /actuator/prometheus + Resilience4j metric expose
# (kakaotalk retry/circuit) + Sprint 4 EP-EX14 STOMP push count + custom KPI gauges.
#
# 실행: docker-compose -f docker-compose.observability.yml up
# UI: http://localhost:9090
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: scheduling-stg
    region: kr-seoul

scrape_configs:
  # ===== Spring Boot app (백엔드 — actuator) =====
  - job_name: scheduling-app
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          service: scheduling-backend
          env: stg
    # Bearer JWT — actuator 보호 시 token 자동 갱신 필요 (Sprint 7+)

  # ===== Spring Boot embedded JVM =====
  # JVM, JDBC HikariCP, Hibernate stats 는 actuator/prometheus 에 포함

  # ===== Prometheus self-monitoring =====
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

